<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeamBudget — Kierunki komunikacji ATF</title>
<meta name="description" content="Pięć kierunków komunikacji TeamBudget: master i cztery role kampanijne, każdy jako kompletny zestaw ATF.">
<link rel="icon" href="sygnet.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--pale-white,#FFFBF4);color:var(--pale-black,#473A39);line-height:1.55;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1240px;margin:0 auto;padding-left:28px;padding-right:28px;}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;text-align:left;}

.top{padding:44px 0 10px;}
.days{display:flex;gap:8px;margin-top:18px;}
.day-btn{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;padding:9px 16px;border-radius:100px;border:1px solid rgba(67,117,255,.4);color:var(--blue,#4375FF);transition:.15s;}
.day-btn:hover{background:rgba(67,117,255,.08);}
.day-btn.on{background:var(--blue,#4375FF);color:#fff;border-color:var(--blue,#4375FF);}
.top .mono{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange,#FE692B);font-weight:500;}
.top h1{font-family:'Pangram Sans','DM Sans',sans-serif;font-size:clamp(28px,3.6vw,44px);font-weight:700;letter-spacing:-.035em;color:var(--blue,#4375FF);margin-top:10px;line-height:1.05;}
.top p{color:rgba(67,117,255,.78);margin-top:10px;max-width:66ch;font-size:15px;}

.mix{display:grid;grid-template-columns:400px minmax(0,1fr);gap:36px;align-items:start;padding-top:28px;padding-bottom:70px;}
@media(max-width:980px){.mix{grid-template-columns:1fr;}}

/* left: direction list */
.dirs{display:flex;flex-direction:column;gap:10px;}
.dir{border:1px solid rgba(67,117,255,.28);border-radius:16px;padding:16px 18px;background:#fff;transition:.15s;}
.dir:hover{border-color:var(--blue,#4375FF);}
.dir.on{border-color:var(--blue,#4375FF);box-shadow:inset 0 0 0 1px var(--blue,#4375FF),0 8px 22px rgba(67,117,255,.10);background:rgba(67,117,255,.05);}
.dir .d-tag{display:inline-block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:rgba(67,117,255,.7);background:rgba(67,117,255,.09);border-radius:100px;padding:3px 10px;}
.dir .d-tag.rec{background:var(--orange,#FE692B);color:#fff;}
.dir h3{font-family:'Pangram Sans','DM Sans',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--blue,#4375FF);margin-top:9px;line-height:1.2;}
.dir p{font-size:12.5px;color:rgba(71,58,57,.62);margin-top:6px;line-height:1.5;}

/* right: preview */
.stage{position:sticky;top:20px;}
@media(max-width:980px){.stage{position:static;}}
.atf{background:var(--sunny,#FEF3DE);border-radius:18px;padding:40px 40px 34px;box-shadow:0 10px 34px rgba(71,58,57,.08);}
.atf .tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange,#FE692B);font-weight:500;}
.atf h2{font-family:'Pangram Sans','DM Sans',sans-serif;font-size:clamp(30px,3.6vw,46px);font-weight:700;letter-spacing:-.04em;line-height:1.03;color:var(--blue,#4375FF);margin-top:14px;max-width:16ch;text-wrap:balance;}
.pv-claim{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange,#FE692B);font-weight:500;margin-top:12px;display:none;}
.atf.claims-mode h2,.atf.claims-mode .sub,.atf.claims-mode .para,.atf.claims-mode .cta,.atf.claims-mode .proof,.atf.claims-mode .checks{display:none;}
.atf.claims-mode .cl-list{margin-top:18px;}
.cl-list{display:none;flex-direction:column;gap:12px;margin-top:26px;}
.atf.claims-mode .cl-list{display:flex;}
.cl-item{display:flex;gap:14px;align-items:baseline;padding:14px 18px;background:#fff;border-radius:14px;border:1px solid rgba(67,117,255,.25);}
.cl-item .n{font-family:'DM Mono',monospace;font-size:10px;color:var(--orange,#FE692B);font-weight:500;flex:0 0 auto;}
.cl-item .t b{font-family:'Pangram Sans','DM Sans',sans-serif;font-size:19px;color:var(--blue,#4375FF);letter-spacing:-.02em;font-weight:700;display:block;line-height:1.25;}
.cl-item .t p{font-size:12.5px;color:rgba(71,58,57,.6);margin-top:3px;line-height:1.5;}
.atf .sub{margin-top:18px;font-size:16.5px;color:var(--blue,#4375FF);max-width:52ch;}
.atf .sub b{font-weight:700;}
.atf .para{margin-top:10px;font-size:15px;color:var(--blue,#4375FF);opacity:.85;max-width:56ch;}
.atf .cta{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;font-weight:600;font-size:14px;border-radius:100px;padding:12px 21px;}
.btn.pri{background:var(--blue,#4375FF);color:#fff;box-shadow:0 4px 14px rgba(67,117,255,.28);}
.btn.gho{background:rgba(71,58,57,.07);color:var(--pale-black,#473A39);}
.proof{display:flex;gap:20px;margin-top:26px;}
.hp{flex:1 1 0;min-width:0;}
.hp .num{font-family:'Pangram Sans',sans-serif;font-size:23px;font-weight:700;letter-spacing:-.02em;color:var(--blue,#4375FF);}
.hp .lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:rgba(67,117,255,.6);margin-top:4px;line-height:1.5;}
.checks{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid rgba(67,117,255,.35);}
.checks span{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--pale-black,#473A39);}
.checks i{font-style:normal;color:var(--orange,#FE692B);font-weight:700;}
.stage-foot{display:flex;margin-top:14px;}
.act{flex:1;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;padding:12px 0;border-radius:100px;text-align:center;background:var(--pale-black,#473A39);color:#fff;transition:.15s;}
.act:hover{opacity:.88;}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--pale-black,#473A39);color:#fff;font-size:13px;font-weight:600;padding:12px 22px;border-radius:100px;transition:.3s;opacity:0;pointer-events:none;z-index:50;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
footer{padding:0 0 46px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.05em;color:rgba(71,58,57,.45);}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <span class="mono">TeamBudget &middot; kierunki komunikacji &middot; ATF</span>
    <div class="days">
      <button class="day-btn" data-day="27.07">Propozycja v1</button>
      <button class="day-btn on" data-day="28.07">Propozycja v2</button>
    </div>
  </div>
</header>

<main class="wrap mix">

  <div class="dirs" id="dirs"></div>

  <div class="stage">
    <div class="atf">
      <span class="tag" id="pvTag"></span>
      <h2 id="pvH"></h2>
      <p class="pv-claim" id="pvClaim"></p>
      <div class="cl-list" id="pvClaims"></div>
      <p class="sub"><b id="pvS"></b><br><span id="pvB"></span></p>
      <p class="para" id="pvP"></p>
      <div class="cta"><span class="btn pri" id="pvC"></span><span class="btn gho">Zobacz, jak to działa &rarr;</span></div>
      <div class="proof" id="pvN"></div>
      <div class="checks" id="pvK"></div>
    </div>
    <div class="stage-foot">
      <button class="act" id="btnCopy">Kopiuj zestaw</button>
    </div>
  </div>

</main>

<footer><div class="wrap">TeamBudget &middot; kierunki komunikacji ATF &middot; master + 4 role &middot; 2026</div></footer>
<div class="toast" id="toast">Skopiowano do schowka</div>

<script>
var DIRS = [
  {
    day: '28.07', tag: 'Claim · propozycje', rec: true, name: 'Propozycje claimu',
    title: 'Uproszczone komunikaty narzędziowe',
    use: 'Trzeci element lockupu: logo + hasło + komunikat. Cztery finałowe opcje, wybieramy jedną.',
    H: 'Kulturę firmy budują zespoły.',
    claims: [
      { t: 'Pierwszy budżet w rękach zespołu', d: 'Kategoria i sprawczość w jednej linii. Wersja brandowa.' },
      { t: 'Budżet zespołu na wspólne chwile', d: 'Najprościej mówi, na co jest ten budżet.' },
      { t: 'Budżet, który dostaje zespół.', d: 'Definicja kategorii wprost, bez ozdobników.' },
      { t: 'Budżet, którym zarządza zespół.', d: 'Akcent na sprawczość: zespół decyduje, nie centrala.' }
    ]
  },
  {
    day: '28.07', tag: 'Marka · narracja odwrócona', rec: true, name: 'Master odwrócony',
    title: 'Pierwszy budżet dla zespołu.',
    use: 'Kolejność SaaS: co to jest, jak działa, dlaczego ważne. Hasło master domyka narrację, nie otwiera.',
    H: 'Pierwszy budżet dla zespołu.',
    claim: 'Kulturę firmy budują zespoły',
    S: 'Zespół sam wybiera wspólne śniadania, przekąski i celebracje.',
    B: 'Firma widzi całość w jednym miejscu, na jednej fakturze.',
    P: 'Kulturę firmy budują zespoły. TeamBudget daje im do tego pierwsze narzędzie: własny budżet, rytm wspólnych chwil i dane, które pokazują efekt.',
    C: 'Zapisz zespoły na pilotaż →',
    N: '2+ wspólne chwile zespołu w każdym miesiącu · 100% decyzji podejmuje zespół, nie centrala · 1 faktura zamiast sterty paragonów',
    K: 'Zero wdrożenia IT · Zero organizacji i maili · Jedna faktura, pełne dane'
  },
  {
    day: '28.07', tag: 'Marka · wersja produktowa', rec: true, name: 'Master produktowy',
    use: 'Komunikat narzędziowy jako head, hasło master jako kicker. Mechanika produktu w trzech zdaniach.',
    H: 'Budżet, którym zarządza zespół.',
    claim: 'Kulturę firmy budują zespoły',
    S: 'Śniadania, przekąski i celebracje, które wracają co dwa tygodnie.',
    B: 'Zespół wybiera i zamawia, my dowozimy pod drzwi.',
    P: 'Firma ustala kwotę i widzi całość: wykorzystanie budżetu, regularność rytuałów i jedną fakturę zamiast chaosu paragonów.',
    C: 'Zapisz zespoły na pilotaż →',
    N: '1 kwota na zespół, ustala ją firma · 2+ wspólne chwile w każdym miesiącu · 0 pracy po stronie HR',
    K: 'Zespół wybiera i zamawia sam · Dostawa pod drzwi zespołu · Raport i faktura dla firmy'
  },
  {
    day: '27.07', tag: 'Marka', rec: true, name: 'Master',
    use: 'Strona, deck, stopka, wszystko co nosi logo. Teza marki na lata.',
    H: 'Kulturę firmy budują zespoły.',
    S: 'Budżet dla zespołu. Kultura dla firmy.',
    B: 'Bo najważniejsze rozmowy i tak dzieją się przy kawie.',
    P: 'TeamBudget to prosty pomysł: zespół dostaje własny budżet na wspólne śniadania, przekąski i świętowanie. Sam wybiera, co i kiedy. Firma widzi całość na jednej fakturze.',
    C: 'Zapisz zespoły na pilotaż →',
    N: '2+ wspólne chwile zespołu w każdym miesiącu · 100% decyzji podejmuje zespół, nie centrala · 1 faktura zamiast sterty paragonów',
    K: 'Zespół wybiera sam · Dostawa pod drzwi · Jedna faktura, pełne dane'
  },
  {
    day: '27.07', tag: 'Platforma kampanijna', rec: false, name: 'Platforma',
    use: 'Kampania wizerunkowa, OOH, event. Hook platformy „Między ludźmi”.',
    H: 'Ludzie lubią ludzi, z którymi jedzą.',
    S: 'Śniadanie zrobi więcej niż niejedno spotkanie.',
    B: 'Bo „dobra robota” smakuje lepiej z ciastkiem.',
    P: 'Nie zabieramy benefitów. Dodajemy to, czego w nich brakuje: wspólne chwile dla całego zespołu, w rytmie, który wraca co miesiąc.',
    C: 'Dajcie zespołom budżet →',
    N: '15 minut przy stole robi więcej niż godzina na callu · 2+ wspólne chwile w każdym miesiącu · 0 pracy do wykonania po stronie HR',
    K: 'Śniadania, przekąski, świętowanie · Rytm zamiast zrywu · Zero roboty dla HR'
  },
  {
    day: '27.07', tag: 'Performance', rec: false, name: 'Performance',
    use: 'Zimny ruch: ads, cold mail, search. Zrozumienie produktu w 5 sekund.',
    H: 'Pierwszy budżet, który dostaje cały zespół.',
    S: 'Zespół wybiera, my dowozimy, firma widzi.',
    B: 'Bo karta sportowa jeszcze nikogo nie zżyła z zespołem.',
    P: 'Zespół klika, wybiera i świętuje. My dowozimy pod drzwi. Firma dostaje jedną fakturę i dane, które w końcu coś mówią.',
    C: 'Zacznij od jednego zespołu →',
    N: '0 nowych budżetów, porządkujemy to, co już wydajecie · 100% zespołu przy stole, nie 30% na karcie · 1 faktura i pełne dane dla firmy',
    K: 'Start bez wdrożenia IT · Bez nowych budżetów · Bez ankiet i regulaminów'
  },
  {
    day: '27.07', tag: 'Problem', rec: false, name: 'Problem',
    use: 'Social, hooki wideo, pierwszy slajd decka. Otwiera napięcie.',
    H: 'Kiedy wasz zespół ostatnio śmiał się razem?',
    S: 'Silne zespoły nie zdarzają się same.',
    B: 'Bo z awatarem na Teamsie trudno się zaprzyjaźnić.',
    P: 'Relacje w zespołach rzadko kończą się kłótnią. Częściej po cichu wygasają z braku okazji. TeamBudget daje okazje, zanim trzeba będzie cokolwiek ratować.',
    C: 'Sprawdź na swoich zespołach →',
    N: '1 integracja rocznie to za mało, żeby się poznać · 2+ momenty w miesiącu, żeby się polubić · 12 miesięcy rytmu, żeby zostać',
    K: 'Rytm zamiast zrywu · Więź widoczna w danych · Zanim odejdą najlepsi'
  },
  {
    day: '27.07', tag: 'Konwersja', rec: false, name: 'Konwersja',
    use: 'Remarketing i domykanie rozgrzanego ruchu. Mechanika + dowód.',
    H: 'Co dwa tygodnie razem. Efekt widać w danych.',
    S: 'Nie event raz w roku. Rytm co dwa tygodnie.',
    B: 'Bo po zeszłorocznej integracji została tylko fotorelacja.',
    P: 'Dwa wspólne momenty w miesiącu wystarczą, żeby zespół przestał być listą nazwisk. Zaczynacie od pilotażu: bez ryzyka, bez wdrożenia IT.',
    C: 'Umówcie pierwsze śniadanie →',
    N: '72h od zgłoszenia do pierwszego terminu · 3 zespoły wystarczą na start · 0 zł za platformę w pilotażu',
    K: 'Pilotaż bez zobowiązań · Kontakt w 72 godziny · Efekt w danych, nie deklaracjach'
  }
];
var cur = 0;
var curDay = '28.07';

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function render(){
  var v = DIRS[cur];
  document.getElementById('pvTag').textContent = v.tag;
  document.getElementById('pvH').textContent = v.H;
  var cl = document.getElementById('pvClaim');
  cl.textContent = v.claim || '';
  cl.style.display = v.claim ? 'block' : 'none';
  var atfEl = document.querySelector('.atf');
  atfEl.classList.toggle('claims-mode', !!v.claims);
  document.getElementById('pvClaims').innerHTML = (v.claims || []).map(function(c,i){
    return '<div class="cl-item"><span class="n">0'+(i+1)+'</span><span class="t"><b>'+esc(c.t)+'</b><p>'+esc(c.d)+'</p></span></div>';
  }).join('');
  document.getElementById('pvS').textContent = v.S;
  document.getElementById('pvB').textContent = v.B;
  document.getElementById('pvP').textContent = v.P;
  document.getElementById('pvC').textContent = v.C;
  document.getElementById('pvN').innerHTML = v.N.split('·').map(function(item){
    item = item.trim();
    var m = item.match(/^(\S+)\s+([\s\S]+)$/);
    return '<div class="hp"><div class="num">'+esc(m?m[1]:item)+'</div><div class="lbl">'+esc(m?m[2]:'')+'</div></div>';
  }).join('');
  document.getElementById('pvK').innerHTML = v.K.split('·').map(function(item){
    return '<span><i>&#10003;</i> '+esc(item.trim())+'</span>';
  }).join('');
  var els = document.querySelectorAll('.dir');
  for (var i=0;i<els.length;i++){ els[i].classList.toggle('on', +els[i].dataset.i===cur); }
}

function buildCards(){
  var host = document.getElementById('dirs');
  host.innerHTML = DIRS.map(function(v,i){
    if (v.day !== curDay) return '';
    return '<button class="dir" data-i="'+i+'">'+
      '<span class="d-tag'+(v.rec?' rec':'')+'">'+esc(v.tag)+'</span>'+
      '<h3>'+esc(v.title || v.H)+'</h3>'+
      '<p>'+esc(v.use)+'</p>'+
    '</button>';
  }).join('');
}
function build(){
  buildCards();
  document.getElementById('dirs').addEventListener('click', function(e){
    var b = e.target.closest('.dir');
    if (!b) return;
    cur = +b.dataset.i;
    render();
  });
  var days = document.querySelectorAll('.day-btn');
  for (var d=0; d<days.length; d++){
    days[d].addEventListener('click', function(){
      curDay = this.dataset.day;
      for (var k=0; k<days.length; k++){ days[k].classList.toggle('on', days[k]===this); }
      for (var j=0; j<DIRS.length; j++){ if (DIRS[j].day===curDay){ cur=j; break; } }
      buildCards();
      render();
    });
  }
}

function copyDone(t){
  function done(){
    var el = document.getElementById('toast');
    el.classList.add('show');
    setTimeout(function(){ el.classList.remove('show'); }, 1800);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done, done);
  } else {
    var ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta); done();
  }
}

document.getElementById('btnCopy').addEventListener('click', function(){
  var v = DIRS[cur];
  var t;
  if (v.claims) {
    t = ['Uproszczone komunikaty narzędziowe TeamBudget', ''].concat(
      v.claims.map(function(c,i){ return (i+1)+'. '+c.t+' ('+c.d+')'; })
    ).join('\n');
    copyDone(t);
    return;
  }
  t = [
    'ATF — ' + v.name + ' (' + v.tag + ')',
    '',
    'H1: ' + v.H,
    (v.claim ? 'Claim: ' + v.claim : null),
    'Subline: ' + v.S,
    v.B,
    'Akapit: ' + v.P,
    'CTA: ' + v.C + '  |  Zobacz, jak to działa →',
    'Liczby: ' + v.N,
    'Checki: ' + v.K
  ].filter(function(x){return x!==null;}).join('\n');
  copyDone(t);
});

build();
render();
</script>

</body>
</html>
